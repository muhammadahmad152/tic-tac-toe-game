<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe Game</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <nav>
        <ul>
            <li>MyTicTacToe.com</li>
        </ul>
    </nav>

    <div class="gameContainer">
        <!-- Tic Tac Toe Grid -->
        <div class="container">
            <div class="line"></div>
            <div class="box bt-0 bl-0"><span class="boxtext"></span></div>
            <div class="box bt-0"><span class="boxtext"></span></div>
            <div class="box bt-0 br-0"><span class="boxtext"></span></div>
            <div class="box bl-0"><span class="boxtext"></span></div>
            <div class="box"><span class="boxtext"></span></div>
            <div class="box br-0"><span class="boxtext"></span></div>
            <div class="box bl-0 bb-0"><span class="boxtext"></span></div>
            <div class="box bb-0"><span class="boxtext"></span></div>
            <div class="box bb-0 br-0"><span class="boxtext"></span></div>
        </div>

        <!-- Game Info & Controls -->
        <div class="gameInfo">
            <h1>Welcome To Tic TacToe</h1>

            <!-- Scoreboard -->
            <div class="scoreDisplay">X: 0 | O: 0</div>

            <!-- Mode Switcher -->
            <div class="mode-container">
                <button id="modeToggle">Mode: Vs Unbeatable AI</button>
            </div>

            <!-- Turn Status & Reset Button -->
            <div>
                <span class="info">Turn For X</span>
                <button id="reset">Reset</button>
            </div>

            <!-- Winner GIF Display -->
            <div class="imgbox">
                <img src="excited1.gif" alt="Winner Celebration">
            </div>
        </div>
    </div>

    <!-- JavaScript File Linking -->
    <script src="script.js"></script>
</body>

</html>
